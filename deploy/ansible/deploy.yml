---
- name: Kainest Backend - Deploy & Force Update
  hosts: webservers
  become: yes
  become_method: sudo
  become_user: root
  vars:
    project_dir: "/opt/kainest-backend"
    
  tasks:
    - name: Membuat folder proyek di server target
      file:
        path: "{{ project_dir }}"
        state: directory
        mode: "0755"

    - name: Menyalin file docker-compose.deploy.yml ke server target
      copy:
        src: ../../docker-compose.deploy.yml
        dest: "{{ project_dir }}/docker-compose.yml"

    - name: Generate file .env di server target
      copy:
        content: |
          NODE_ENV=production
          TARGET_IMAGE={{ target_image }}
          DATABASE_URL={{ database_url }}
          BETTER_AUTH_SECRET={{ better_auth_secret }}
          BETTER_AUTH_URL={{ better_auth_url }}
          GOOGLE_CLIENT_ID={{ google_client_id }}
          GOOGLE_CLIENT_SECRET={{ google_client_secret }}
          G1THUB_CLIENT_ID={{ github_client_id }}
          G1THUB_CLIENT_SECRET={{ github_client_secret }}
          G1THUB_TOKEN_API={{ github_token_api | default('', true) }}
          G1THUB_RELEASES_OWNER={{ github_releases_owner | default('khensin166', true) }}
          G1THUB_RELEASES_REPO={{ github_releases_repo | default('Kainest', true) }}
          GROQ_API_KEY={{ groq_api_key }}
          CLOUDFLARE_WHISPER_URL={{ cloudflare_whisper_url | default('https://kainest-ear.kenan2020oke.workers.dev', true) }}
          RESEND_API_KEY={{ resend_api_key }}
          RESEND_FROM_EMAIL={{ resend_from_email }}
          CLOUDINARY_CLOUD_NAME={{ cloudinary_cloud_name }}
          CLOUDINARY_API_KEY={{ cloudinary_api_key }}
          CLOUDINARY_API_SECRET={{ cloudinary_api_secret }}
          FRONTEND_URL={{ frontend_url }}
          CORS_ALLOWED_ORIGINS={{ cors_allowed_origins | default('', true) }}
          AUTH_TRUSTED_ORIGINS={{ auth_trusted_origins | default('', true) }}
          COOKIE_DOMAIN={{ cookie_domain | default('kenantomfie.com', true) }}
          GOWA_BASE_URL={{ gowa_base_url }}
          WA_BOT_API_KEY={{ gowa_api_key }}
          GOWA_DEVICE_ID={{ gowa_device_id }}
          GOWA_WEBHOOK_SECRET={{ gowa_webhook_secret | default('', true) }}
          BOT_ENV_MODE={{ bot_env_mode }}
          SPREADSHEET_ID={{ spreadsheet_id }}
          GOOGLE_API_KEY_SPREADSHEET={{ google_api_key_spreadsheet }}
          SHIFT_REMINDER_TARGET_JID={{ shift_reminder_target_jid | default('', true) }}
          ENABLE_SCHEDULER={{ enable_scheduler }}
          GRAFANA_LOKI_URL={{ grafana_loki_url }}
          RECEIPT_AI_TOKEN={{ receipt_ai_token }}
          RECEIPT_AI_URL={{ receipt_ai_url }}
          ACADEMIC_DATA_DIR=/app/data/academic
          ACADEMIC_EXCEL_DOWNLOAD_URL={{ academic_excel_download_url | default('', true) }}
          ACADEMIC_REMINDER_TARGET_PHONE={{ academic_reminder_target_phone | default('', true) }}
          ACADEMIC_SYNC_CRON={{ academic_sync_cron | default('0 */6 * * *', true) }}
          ACADEMIC_SYNC_BATCH_SIZE={{ academic_sync_batch_size | default('30', true) }}
          ACADEMIC_ARCHIVE_RETENTION_DAYS={{ academic_archive_retention_days | default('2', true) }}
          ACADEMIC_DB_RETENTION_DAYS={{ academic_db_retention_days | default('30', true) }}
          ACADEMIC_MUTE_WEEKLY_LECTURE={{ academic_mute_weekly_lecture | default('true', true) }}
        dest: "{{ project_dir }}/.env"
        mode: '0600'
      no_log: true
    
    - name: Memastikan jaringan global 'kainest_net' tersedia
      command: docker network create kainest_net
      register: network_result
      failed_when: 
        - network_result.rc != 0
        - "'already exists' not in network_result.stderr"
      changed_when: network_result.rc == 0

    - name: Login ke GitHub Container Registry (GHCR) di server target
      shell: echo "{{ ghcr_token }}" | docker login ghcr.io -u "{{ ghcr_user }}" --password-stdin
      when: ghcr_token is defined and ghcr_token != ""
      no_log: true

    - name: Memaksa pembaruan (Pull & Up) Docker Compose
      command: docker compose up -d --pull always --force-recreate --remove-orphans
      args:
        chdir: "{{ project_dir }}"
      register: compose_result
      failed_when: compose_result.rc != 0
      ignore_errors: yes

    - name: Debug Docker Compose Output (Jika Gagal)
      debug:
        msg:
          stdout: "{{ compose_result.stdout_lines | default([]) }}"
          stderr: "{{ compose_result.stderr_lines | default([]) }}"
      when: compose_result.rc != 0

    - name: Ambil log container jika startup gagal
      command: docker logs --tail=50 kainest-backend
      register: container_crash_logs
      when: compose_result.rc != 0
      ignore_errors: yes

    - name: Tampilkan log crash container
      debug:
        msg: "{{ container_crash_logs.stdout_lines | default(container_crash_logs.stderr_lines) }}"
      when: compose_result.rc != 0 and container_crash_logs is defined

    - name: Fail jika Docker Compose Gagal
      fail:
        msg: "Deployment gagal pada tahapan Docker Compose."
      when: compose_result.rc != 0

    - name: Hapus image lama yang tidak terpakai (Prune)
      command: docker image prune -f

    - name: Verifikasi Container Berjalan
      command: "docker inspect kainest-backend --format='{{ '{{' }}.State.Status{{ '}}' }}'"
      register: container_status
      retries: 5
      delay: 5
      until: container_status.stdout == "running"
