version: "3.8"

services:
  kainest_backend:
    image: ${TARGET_IMAGE:-ghcr.io/khensin166/kainest-be:latest}
    container_name: kainest-backend
    restart: always
    ports:
      - "127.0.0.1:3001:3000" # Bind localhost saja agar trafik wajib lewat Caddy reverse proxy (TLS)
    env_file:
      - .env
    networks:
      - kainest_net
    # Optional: If you have persistent files like logs or local uploads
    volumes:
      - kainest_be_logs:/app/logs
      - kainest_be_academic_data:/app/data/academic
    logging:
      driver: loki
      options:
        loki-url: "${GRAFANA_LOKI_URL}"
        loki-external-labels: job=docker,environment=production,service=kainest-backend
        loki-retries: "2"
        loki-max-backoff: "1000ms"
        mode: non-blocking
        max-buffer-size: "4m"
    environment:
      - NODE_OPTIONS=--max-old-space-size=256
      # Kita batasin sesuai dengan sisa space ram di dalam server
networks:
  kainest_net:
    external: true

volumes:
  kainest_be_logs:
  kainest_be_academic_data:
